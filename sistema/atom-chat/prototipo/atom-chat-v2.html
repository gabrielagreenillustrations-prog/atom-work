function metaHTML(m,A){ use('_atom-chat-meta'); const f=A.flags||{}; const st=A.status&&A.status!=='real'?A.status:m.status;

// ===== logs (Explore Logs) =====
const LOGT={
 kb:{icon:'book',verb:'Consultó'}, catalog:{icon:'database',verb:'Consultó'}, tool:{icon:'hammer',verb:'Ejecutó'}, capture:{icon:'input-pipe',verb:'Capturó'},
 stage:{icon:'square-kanban',verb:'Movió a',flat:1}, typify:{icon:'layer-group',verb:'Tipificó en',flat:1}, tag:{icon:'tag',verb:'Etiquetó con',flat:1},
 generate:{icon:'hammer',verb:'Generó',flat:1}, edit:{icon:'hammer',verb:'Editó',flat:1}, insert:{icon:'puzzle-piece',verb:'Insertó'}, fail:{icon:'circle-x',verb:'No se pudo ejecutar',flat:1}, stop:{icon:'stop-circle',verb:'Se detuvo la tarea',flat:1},
 sheets:{icon:'sheets',verb:'Consultó'}, };
const ROBOX=(label,txt,act)=>`<div class="flex flex-col gap-[8px] items-start w-full"><p class="font-medium ${T12} text-[#27272a] truncate w-full">${label}</p><div class="bg-[white] border border-[#d4d4d8] border-solid flex flex-col gap-[4px] items-start pb-[8px] pt-[12px] px-[12px] rounded-[4px] w-full"><div class="ro ${T12} text-[#52525c] w-full">${esc(txt)}</div><div class="flex items-center justify-between w-full">${ib('copy','toast','Copiado al portapapeles','Copiar')}<span class="relative size-[16px]"><span class="thumb"></span></span></div></div></div>`;
const SQL='SELECT\n   modelo_id,\n   modelo_nombre,\n   version,\n   color, año, precio_usd, disponibilidad\nFROM catalogo_autos\nWHERE marca = \'Toyota\' AND modelo = \'Corolla\'';
const JSONR='[\n   {\n      "modelo_id": "COR-2026-LE-001",\n      "modelo_nombre": "Corolla LE",\n      "version": "LE", "color": "Blanco perla", "año": 2026, "precio_usd": 24950, "disponibilidad": "disponible"\n   }\n]';
function logBody(L){ const kv=(k,v)=>`<div class="flex gap-[4px] items-start"><p class="leading-[16px] text-[12px] text-[#71717b]">${k}</p><p class="font-medium leading-[16px] text-[12px] text-[#71717b]">${esc(v)}</p></div>`;
 const fail=L.error;
 if(L.t==='kb') return `<p class="leading-[16px] text-[12px] text-[#71717b]">12/12/24 9:30:22 · Similitud 0.68</p>${fail?`<p class="leading-[16px] text-[12px] text-[#71717b]">No se pudo leer el documento (formato no soportado).</p>`:ROBOX('Información recuperada:','Corolla LE 2026 Motor: 1.8L 4 cilindros DOHC. Potencia: 139 hp @ 5000 RPM. Torque: 126 lb-ft @ 4400 RPM. Transmisión: CVT automática. Tracción: Delantera. Consumo combustible: 28 MPG ciudad / 36 MPG carretera. Tanque: 50.2 litros')}<div class="flex gap-[4px] items-center"><p class="leading-[16px] text-[12px] text-[#71717b]">Chunks usados</p><p class="font-medium leading-[16px] text-[12px] text-[#71717b]">6</p>${lnk('Mostrar más','toast','Mostrando 6 fragmentos')}</div>`;
 if(L.t==='catalog'||L.t==='sheets') return `${ROBOX('Consulta:',SQL)}${ROBOX('Resultado:',fail?'Error: tabla no encontrada':JSONR)}`;
 if(L.t==='tool') return `<div class="flex flex-col gap-[4px]">${kv('Método:','GET')}${kv('Código:',fail?'400':'200')}${kv('URL:','https://api.notion.com/v1/databases/{database_id}/query')}</div>${ROBOX('Petición:',SQL)}${ROBOX('Respuesta de servidor:',fail?'No encontrado':JSONR)}`;
 if(L.t==='capture') return fail?`<p class="leading-[16px] text-[12px] text-[#71717b]">El cliente no compartió este dato.</p>`:`<div class="flex gap-[4px] items-center"><p class="font-medium leading-[16px] text-[12px] text-[#27272a]">Valor:</p><p class="leading-[16px] text-[12px] text-[#27272a] [overflow-wrap:anywhere]">${esc(L.value||'—')}</p>${ib('copy','toast','Valor copiado','Copiar valor','text-[#27272a]')}</div>`;
 if(L.t==='insert') return `<p class="leading-[16px] text-[12px] text-[#71717b]">Plantilla «Prueba de manejo 1/4» insertada en el flujo.</p>`;
 return ''; }
function logHTML(L,key){ use('_atom-chat-log'); const d=LOGT[L.t]||LOGT.kb; const fail=!!L.error; const verb=fail&&!d.flat?(L.t==='tool'?'Falló':L.t==='capture'?'No capturó':d.verb+' y falló'):d.verb; const body=d.flat?'':logBody(L); const open=S.ui.logs.has(key)||(S.args.logsOpen&&!d.flat);
 const icon=fail?'circle-x':(L.loading?'spinner':d.icon); const name=L.name||'';
 const dot=name.lastIndexOf('.'); const ext=dot>0&&name.length-dot<6?name.slice(dot):''; const base=ext?name.slice(0,dot):name;
 const head=`<div class="flex gap-[4px] items-center min-w-0 max-w-full"><span class="flex items-center justify-center w-[14px] shrink-0 text-[#71717b] ${L.loading?'spin':''}">${I(icon,12)}</span><p class="leading-[16px] text-[12px] text-[#71717b] whitespace-nowrap ${L.loading?'shine':''}">${verb}</p>${name?`<p class="font-medium leading-[16px] text-[12px] text-[#71717b] truncate min-w-0">${esc(base)}</p>${ext?`<p class="font-medium leading-[16px] text-[12px] text-[#71717b] shrink-0">${esc(ext)}</p>`:''}`:''}${body&&!L.loading?`<span class="flex items-center justify-center w-[14px] shrink-0 text-[#71717b]">${I(open?'chevron-down':'chevron-right',10)}</span>`:''}</div>`;
 return `<div class="flex flex-col gap-[8px] items-start w-full row-anim">${body&&!L.loading?`<button class="text-left cursor-pointer max-w-full leading-[16px]" data-act="log" data-id="${key}" aria-expanded="${open}">${head}</button>`:head}${open&&body&&!L.loading?`<div class="flex flex-col gap-[8px] items-start pl-[18px] w-full">${body}</div>`:''}</div>`; }
function logsBlockHTML(b,align){ const mode=S.args.logsMode||'grouped'; if(mode==='hidden') return ''; const items=b.items.filter(x=>S.args.logErrors!==false||!x.error);
 if(!items.length) return '';
 const wrap=c=>`<div class="flex ${align==='end'?'justify-end':''} w-full pt-[16px] shrink-0"><div class="flex flex-col gap-[8px] items-start w-[294px] max-w-full">${c}</div></div>`;
 if(mode==='grouped'&&items.length>1){ const open=S.ui.groups.has(b.id); const errs=items.filter(x=>x.error).length;
  return wrap(`<button class="text-left cursor-pointer leading-[16px]" data-act="group" data-id="${b.id}" aria-expanded="${open}"><div class="flex gap-[4px] items-center"><span class="flex items-center justify-center w-[14px] text-[#71717b]">${I('list-check',12)}</span><p class="leading-[16px] text-[12px] text-[#71717b] whitespace-nowrap">${esc(b.who||'Atomic')} realizó</p><p class="font-medium leading-[16px] text-[12px] text-[#71717b] whitespace-nowrap">${items.length} acciones${errs?` · ${errs} con error`:''}</p><span class="flex items-center justify-center w-[14px] text-[#71717b]">${I(open?'chevron-down':'chevron-right',10)}</span></div></button>${open?`<div class="flex flex-col gap-[8px] items-start pl-[18px] w-full">${items.map((L,i)=>logHTML(L,b.id+'-'+i)).join('')}</div>`:''}`); }
 return wrap(items.map((L,i)=>logHTML(L,b.id+'-'+i)).join('')); }

// ---------- frame interactions ----------
function findMsg(id){ for(const b of S.blocks){ if(b.id===id) return b; } return null; }
function popMenu(anchor,html){ $$('#frame .menu').forEach(m=>m.remove()); const host=$('#frame').firstElementChild; const m=el(`<div class="menu">${html}</div>`); host.appendChild(m); hydrate(m); const s=scaleOf(); const hr=host.getBoundingClientRect(), ar=anchor.getBoundingClientRect(); let l=(ar.left-hr.left)/s, t=(ar.bottom-hr.top)/s+4; if(l+m.offsetWidth>host.offsetWidth-8) l=host.offsetWidth-m.offsetWidth-8; if(t+m.offsetHeight>host.offsetHeight-8) t=(ar.top-hr.top)/s-m.offsetHeight-4; m.style.left=Math.max(8,l)+'px'; m.style.top=Math.max(8,t)+'px'; setTimeout(()=>document.addEventListener('click',function h(e){ if(!m.contains(e.target)){ m.remove(); document.removeEventListener('click',h);} }),0); return m; }
function bindFrame(){ const f=$('#frame');
 const ii=$('#iInput',f); if(ii) ii.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); inboxSend(); } };
 const ai=$('#aInput',f); if(ai){ ai.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); asstAsk(ai.value); } }; ai.onfocus=()=>{ if(!S.ui.focus&&S.args.composer==='ai'){ S.ui.focus=true; const v=ai.value; render(); const n=$('#aInput'); n.value=v; n.focus(); } }; }
 const wi=$('#wInput',f); if(wi){ wi.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); asstAsk(wi.value); } if(e.key==='Escape'){ S.args.state='collapsed'; renderControls(); render(); } }; wi.onfocus=()=>{ if(S.args.state==='collapsed'){ S.args.state='expanded'; renderControls(); render(); $('#wInput').focus(); } }; }
 const ti=$('#tInput',f); if(ti) ti.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); const v=ti.value; ti.value=''; testAsk(v); } };
 const rz=$('#aResize',f); if(rz) rz.onpointerdown=e=>{ e.preventDefault(); rz.classList.add('drag'); const x0=e.clientX, w0=S.width, s=scaleOf(); const mv=ev=>{ S.width=Math.max(360,Math.min(480,Math.round(w0-(ev.clientX-x0)/s))); const p=$('#aPanel'); p.style.width=S.width+'px'; p.parentElement.style.width=(S.width+120)+'px'; docs(); }; const up=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); render(); }; document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up); };
 // inbox header buttons
 const col=$('#iCol',f); if(col){ const bs=$$('[data-name="Buttons"] > *',col); const [bLead,bTip,...rest]=bs; [bLead,bTip,...rest].forEach((b,i)=>{ if(!b) return; b.classList.add('tbtn'); b.style.cursor='pointer'; b.title=['Etapa del cliente','Tipificar','Transferir','Posponer','Marcar como no leída','Finalizar gestión'][i]||''; });
  if(bLead) bLead.onclick=e=>{ e.stopPropagation(); const m=popMenu(bLead,menuHTML([['square-kanban','Lead'],['square-kanban','Prospecto'],['square-kanban','Negociación'],['square-kanban','Cliente']],'stage')); };
  if(bTip) bTip.onclick=e=>{ e.stopPropagation(); popMenu(bTip,menuHTML([['layer-group','Consulta de modelos'],['layer-group','Test drive'],['layer-group','Financiamiento'],['layer-group','Reclamo']],'typify')); };
  if(rest[3]) rest[3].onclick=()=>{ S.blocks.push(B({k:'event',type:'closure',label:'Gestión finalizada',time:nowT(),cat:'events'})); S.args.composer='blocked'; S.args.blockedReason='closed'; renderControls(); render(true); };
  rest.slice(0,3).forEach((b,i)=>{ if(b) b.onclick=()=>toast(['Transferir (menú de agentes)','Conversación pospuesta hasta mañana 9:00 am','Marcada como no leída'][i]); });
  $$('[data-name="Tabs Buttons"] > *',col).forEach((b,i)=>{ b.classList.add('tbtn'); b.style.borderRadius='8px'; b.style.cursor='pointer'; b.title=['Datos del contacto','Notas','Citas','Agregar app','HubSpot'][i]||''; b.onclick=()=>toast(b.title+' (panel lateral)'); }); }
 // wizard config tabs
 const cfg=$('#wConfig',f); if(cfg){ const ct=$$('[data-name="❖ atom-tabs"] > *',cfg); ct.forEach((t,i)=>{ t.style.cursor='pointer'; t.style.borderBottom=i===0?'2px solid #09090b':'2px solid transparent'; t.onclick=()=>toast((t.textContent||'').trim()+' (fuera de este componente)'); }); }
 f.onclick=onAct; }
function onAct(e){ const t=e.target.closest('[data-act]'); if(!t||!t.dataset.act) return; const act=t.dataset.act, id=t.dataset.id, v=t.dataset.v; const m=id?findMsg(id):null; const A=S.args;
 const tog=(set,k)=>{ set.has(k)?set.delete(k):set.add(k); render(); };
 switch(act){
  case 'more': return tog(S.ui.more,id); case 'log': return tog(S.ui.logs,id); case 'group': return tog(S.ui.groups,id); case 'flow': return tog(S.ui.flow,id);
  case 'think': if(S.ui.think.has(id)){ S.ui.think.delete(id); S.ui.thinkClosed.add(id); } else { S.ui.think.add(id); S.ui.thinkClosed.delete(id); } return render();
  case 'undo': { const un=!S.ui.undone.has(id); tog(S.ui.undone,id); return toast(un?'Cambios deshechos':'Cambios aplicados de nuevo'); }
  case 'togglech': return tog(S.ui.hiddenCh,id);
  case 'ver': { A.version=id; if(id==='reverted') toast('Se restauró la versión anterior'); renderControls(); return render(); }
  case 'toast': return toast(id||'Acción simulada');
  case 'copy': try{ navigator.clipboard.writeText((m&&(m.text||m.parts?.find(p=>p.p==='text')?.text))||'').catch(()=>{}); }catch(err){} return toast('Copiado');
  case 'reply': { if(A.composer==='blocked'||A.composer==='none'){ return toast('Interviene la conversación para responder'); } const txt=m.text||m.parts.find(p=>p.p==='text')?.text||'Adjunto'; S.ui.replyTo={author:m.side==='in'?'Marcela':(AUTH[m.who]||AUTH.agent).name,text:txt}; if(A.composer==='note'){A.composer='message'; renderControls();} render(); $('#iInput')&&$('#iInput').focus(); return; }
  case 'unquote': S.ui.replyTo=null; return render();
  case 'react': { e.stopPropagation(); const mm=popMenu(t,`<div class="bg-[white] border-[0.5px] border-[#e4e4e7] border-solid flex gap-[2px] p-[4px] rounded-[1000px] shadow-[0px_6px_14px_0px_rgba(9,9,11,0.08)]">${['👍','❤️','😂','😮','🙏'].map(x=>`<button class="hov cursor-pointer rounded-[1000px] size-[28px] text-[16px]" data-emo="${x}">${x}</button>`).join('')}</div>`); mm.onclick=ev=>{ const b=ev.target.closest('[data-emo]'); if(!b) return; m.reactions=m.reactions||[]; const r=m.reactions.find(x=>x[0]===b.dataset.emo); r?r[1]++:m.reactions.push([b.dataset.emo,1]); A.cats.add('reactions'); mm.remove(); render(); }; return; }
  case 'mmenu': { e.stopPropagation(); popMenu(t,menuHTML(MENU_ITEMS,id)); return; }
  case 'menuitem': { $$('#frame .menu').forEach(x=>x.remove()); if(id==='stage'){ const lead=$$('#iCol [data-name="Buttons"] > *')[0]; S.blocks.push(B({k:'logs',who:'Gabriela',items:[{t:'stage',name:v}],cat:'logs'})); render(true); return; } if(id==='typify'){ S.blocks.push(B({k:'logs',who:'Gabriela',items:[{t:'typify',name:v}],cat:'logs'})); render(true); return; }
   if(!m) return; if(v==='Responder') return onAct({target:Object.assign(document.createElement('b'),{dataset:{act:'reply',id}})});
   if(v==='Destacar'){ m.starred=!m.starred; A.cats.add('meta'); return render(); } if(v==='Fijar'){ m.pinned=!m.pinned; A.cats.add('meta'); return render(); } if(v==='Reenviar'){ m.forwarded=true; A.cats.add('meta'); render(); return toast('Mensaje reenviado'); }
   if(v==='Editar'){ if(m.side!=='out') return toast('Solo puedes editar tus mensajes'); m.edited=true; A.cats.add('meta'); render(); return toast('Mensaje editado'); }
   if(v.startsWith('Eliminar')){ m.parts=[{p:'deleted'}]; m.side==='out'?null:null; m.cat='deleted'; A.cats.add('deleted'); render(); return toast(v); }
   return toast(v); }
  case 'retry': { m.status='sending'; render(); setTimeout(()=>{ m.status='sent'; render(); },800); return; }
  case 'retryu': { m.error=false; render(); return toast('Mensaje reenviado'); }
  case 'mstate': { const pt=m.parts.find(p=>p.p==='media'); if(pt.state==='expired') return toast('El archivo ya no está disponible en el canal'); pt.state='loading'; render(); setTimeout(()=>{ pt.state=null; render(); },1200); return; }
  case 'qr': { m.parts.find(p=>p.p==='quick').state='used'; S.blocks.push(B({k:'msg',side:'in',time:nowT(),quote:{author:'Agente',text:'Oferta del mes'},parts:[{p:'interactive',type:'button'},{p:'text',text:v}],cat:'in-interactive'})); return render(true); }
  case 'ctab': { if(A.composer==='blocked') return toast('Interviene la conversación para escribir'); A.composer=id; renderControls(); render(); $('#iInput')&&$('#iInput').focus(); return; }
  case 'summary': { const lbl=t.lastElementChild; lbl.classList.add('shine'); lbl.textContent='Resumiendo…'; setTimeout(()=>{ S.blocks.push(outT('note','Marcela pidió información de modelos; se ofrecieron VW T-Cross y VW Tera. Quiere un test drive del VW Tera. Pendiente: confirmar sucursal y horario.',{author:'Resumen IA',time:nowT()})); A.cats.add('notes'); render(true); },1300); return; }
  case 'intervene': { A.composer='message'; S.blocks.push(B({k:'event',type:'assignment',who:'Gabriela Landaverde',verb:'intervino la conversación de',label:'Yelsis Nunez',time:nowT(),cat:'events'})); renderControls(); render(true); $('#iInput')&&$('#iInput').focus(); return; }
  case 'reopen': { A.composer='message'; S.blocks.push(B({k:'event',type:'system',label:'Conversación reabierta por Gabriela',cat:'events'})); renderControls(); return render(true); }
  case 'template': { S.blocks.push(B({k:'msg',side:'out',who:'agent',status:'sent',time:nowT(),parts:[{p:'template'},{p:'quick',state:'enabled'}],cat:'out-rich'})); A.composer='message'; A.cats.add('out-rich'); renderControls(); render(true); return; }
  case 'send': return inboxSend();
  case 'attach': { e.stopPropagation(); const mm=popMenu(t,menuHTML([['image','Imagen'],['file-lines','Documento'],['location-dot','Ubicación'],['user','Contacto']],'attach')); mm.onclick=ev=>{ const b=ev.target.closest('[data-v]'); if(!b) return; ev.stopPropagation(); mm.remove(); const ty={Imagen:'image',Documento:'file',Ubicación:'location',Contacto:'contact'}[b.dataset.v]; const msg=B({k:'msg',side:'out',who:'agent',status:'sending',time:nowT(),parts:[{p:'media',type:ty,caption:ty==='image'?'Foto del modelo':''}],cat:'out-agent'}); S.blocks.push(msg); render(true); setTimeout(()=>{ msg.status='sent'; render(); },800); }; return; }
  case 'emoji': { const i=$('#iInput'); if(i){ i.value+='🙂'; i.focus(); } return; }
  case 'scrollend': { A.scrollBtn=false; renderControls(); return render(true); }
  // assistant
  case 'asend': { const i=$('#aInput'); const v2=i?i.value:''; if(i) i.value=''; return asstAsk(v2); }
  case 'stop': S.stop=true; return;
  case 'newchat': { if(SURF()==='wiz'){ S.blocks=[B({k:'ai',time:nowT(),parts:[{p:'text',text:'¡Hola! Cuéntame qué quieres que haga tu agente y te escribo su objetivo.'}]})]; return render(true); } S.blocks=[]; A.view='empty'; renderControls(); return render(); }
  case 'history': { A.view=A.view==='history'?'chat':'history'; renderControls(); return render(); }
  case 'histall': A.historyView='list'; renderControls(); return render();
  case 'sugall': A.view='empty'; A.suggestions='list'; S.blocks=[]; renderControls(); return render();
  case 'loadhist': { A.view='chat'; S.blocks=id==='Configurar agente de ventas'?ASST_MASTER():[B({k:'user',text:id,time:'Jue',cat:'user'}),B({k:'ai',time:'Jue',parts:[{p:'text',text:'Conversación cargada desde el historial. Puedes seguir donde la dejaste.'}]})]; renderControls(); return render(true); }
  case 'fill': { if(A.view==='history'){ A.view=S.blocks.length?'chat':'empty'; renderControls(); render(); } const i=$('#aInput'); if(i){ i.value=id; i.focus(); } return; }
  case 'option': return asstAsk(v);
  case 'qpick': { S.ui.qsel=+id; render(); setTimeout(()=>{ A.question='none'; S.ui.qsel=null; S.blocks.push(B({k:'ai',time:nowT(),parts:[{p:'answered',items:[['¿Qué tipo de audiencia necesitás?',['Clientes que cerraron venta pero no escriben hace 30 días','Clientes con tipificación de fin positivo en el último mes','Clientes de una etiqueta específica'][+id]]]},{p:'text',text:'Perfecto, uso esa audiencia.'}],cat:'questions'})); A.cats.add('questions'); renderControls(); render(true); },450); return; }
  case 'qclose': case 'qskip': A.question='none'; renderControls(); return render();
  case 'model': S.ui.modelOpen=!S.ui.modelOpen; return render();
  case 'pickmodel': S.model=id; S.ui.modelOpen=false; return render();
  case 'pickeffort': S.effort=id; S.ui.modelOpen=false; return render();
  case 'noctx': S.ui.noCtx=true; return render();
  case 'edit': S.ui.editing=id; render(); $('#editBox')&&$('#editBox').focus(); return;
  case 'editcancel': S.ui.editing=null; return render();
  case 'editsave': { const v3=$('#editBox').value; m.text=v3; S.ui.editing=null; render(); return toast('Mensaje actualizado; la IA vuelve a responder'); }
  // wizard
  case 'wsend': { const i=$('#wInput'); const v4=i?i.value:''; if(!v4.trim()){ A.state=A.state==='collapsed'?'expanded':'collapsed'; renderControls(); return render(); } return asstAsk(v4); }
  case 'wmin': A.state='collapsed'; renderControls(); return render();
  // test
  case 'tsend': { const i=$('#tInput'); const v5=i.value; i.value=''; return testAsk(v5); }
  case 'treset': S.blocks=[B({k:'sys',text:'Conversación de prueba reiniciada · '+nowD()}),B({k:'ai',text:'¡Hola! Soy el asistente de Toyota. ¿En qué modelo estás interesado?'})]; return render(true);
  case 'tmenu': { e.stopPropagation(); const mm=popMenu(t,menuHTML([['sparkles','Atom Fast'],['sparkles','Atom Balanced'],['sparkles','Atom Deep'],'-',['paperclip','Adjuntar archivo']],'tmodel')); mm.onclick=ev=>{ const b=ev.target.closest('[data-v]'); if(!b) return; ev.stopPropagation(); mm.remove(); if(b.dataset.v.startsWith('Atom')){ S.model=b.dataset.v; S.blocks.push(B({k:'sys',text:'Modelo cambiado a '+S.model})); render(true); } else toast('Adjuntar (simulado)'); }; return; }
  case 'tcar': { const c=CARS[+id]; return testAsk(v==='Comprar'?`Comprar ${c.n}`:`Más info · ${c.n}`); }
 } }

// ---------- boot ----------
function buildNav(){ const groups=[...new Set(STORIES.map(s=>s.g))]; $('#nav').innerHTML=groups.map(g=>`<div class="grp"><h5>${g}</h5>${STORIES.filter(s=>s.g===g).map(s=>`<button data-id="${s.id}" aria-current="false">${esc(s.t)}</button>`).join('')}</div>`).join(''); $$('#nav button').forEach(b=>b.onclick=()=>openStory(b.dataset.id)); }
function boot(){ hydrate(); buildNav(); $('#bPlay').onclick=play; $('#bReset').onclick=()=>openStory(S.story.id); window.addEventListener('resize',fit); openStory(store.get('acv2-sb','in-full')); }
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',boot):boot();

</script>
